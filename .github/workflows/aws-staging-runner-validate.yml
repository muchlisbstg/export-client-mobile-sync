name: AWS staging runner Terraform validation

on:
  pull_request:
    paths:
      - "infra/aws-staging-schema-runner/**"
      - ".github/workflows/aws-staging-runner-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform fmt and validate (no AWS provisioning)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws-staging-schema-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform initialize without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color
