name: iOS Simulator Build

on:
  pull_request:
    paths:
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "App.tsx"
      - "src/**"
      - ".github/workflows/ios-simulator-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Build and launch unsigned iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Validate Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build for iOS Simulator without code signing
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 2 -name '*.xcworkspace' ! -path '*/Pods/*' -print -quit)"
          test -n "$WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme ExportClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="ios/DerivedData/Build/Products/Debug-iphonesimulator/ExportClient.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-simulator-app.zip

      - name: Boot simulator and launch app smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="ios/DerivedData/Build/Products/Debug-iphonesimulator/ExportClient.app"
          BUNDLE_ID="com.muchlisbstg.exportclient"
          xcrun simctl list devices available -j > ios-simulator-devices.json
          node -e '
            const data = JSON.parse(require("node:fs").readFileSync("ios-simulator-devices.json", "utf8"));
            const device = Object.values(data.devices).flat().find((item) => item.isAvailable && /^iPhone/.test(item.name));
            if (!device) process.exit(2);
            process.stdout.write([device.udid, device.name, device.state].join("\n") + "\n");
          ' > ios-simulator-device-selection.txt
          DEVICE_ID="$(sed -n '1p' ios-simulator-device-selection.txt)"
          DEVICE_NAME="$(sed -n '2p' ios-simulator-device-selection.txt)"
          DEVICE_STATE="$(sed -n '3p' ios-simulator-device-selection.txt)"
          test -n "$DEVICE_ID"
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" app > ios-simulator-app-container.txt
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" | tee ios-simulator-launch.txt
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot ios-simulator-smoke.png
          {
            echo "device_name=$DEVICE_NAME"
            echo "device_udid=$DEVICE_ID"
            echo "device_state_after_launch=Booted"
            echo "bundle_id=$BUNDLE_ID"
          } > ios-simulator-device.txt

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-${{ github.sha }}
          path: ios-simulator-app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Simulator smoke evidence
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-smoke-${{ github.sha }}
          path: |
            ios-simulator-smoke.png
            ios-simulator-launch.txt
            ios-simulator-device.txt
            ios-simulator-app-container.txt
          if-no-files-found: error
          retention-days: 7
