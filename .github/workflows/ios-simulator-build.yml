name: iOS Simulator Build

on:
  pull_request:
    paths:
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "App.tsx"
      - "src/**"
      - ".github/workflows/ios-simulator-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Build, install, and launch unsigned iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Validate Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build for iOS Simulator without code signing
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 2 -name '*.xcworkspace' ! -path '*/Pods/*' -print -quit)"
          test -n "$WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme ExportClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="ios/DerivedData/Build/Products/Debug-iphonesimulator/ExportClient.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx 'com.muchlisbstg.exportclient'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist" | grep -Fx 'ExportClient'
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-simulator-app.zip
          shasum -a 256 ios-simulator-app.zip | tee ios-simulator-app.sha256

      - name: Boot simulator, install app, and verify launch
        id: simulator-smoke
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="ios/DerivedData/Build/Products/Debug-iphonesimulator/ExportClient.app"
          BUNDLE_ID="com.muchlisbstg.exportclient"
          EVIDENCE_DIR="ios-simulator-smoke-evidence"
          mkdir -p "$EVIDENCE_DIR"

          capture_diagnostics() {
            local exit_code=$?
            {
              echo "exit_code=$exit_code"
              echo "bundle_id=$BUNDLE_ID"
              date -u '+captured_at=%Y-%m-%dT%H:%M:%SZ'
            } > "$EVIDENCE_DIR/diagnostic-context.txt"
            xcrun simctl list devices available > "$EVIDENCE_DIR/devices.txt" 2>&1 || true
            if [ -n "${DEVICE_ID:-}" ]; then
              xcrun simctl listapps "$DEVICE_ID" > "$EVIDENCE_DIR/installed-apps.txt" 2>&1 || true
              xcrun simctl io "$DEVICE_ID" screenshot "$EVIDENCE_DIR/simulator-screenshot.png" >/dev/null 2>&1 || true
            fi
            log show --last 5m --style compact --predicate 'process == "ExportClient"' > "$EVIDENCE_DIR/app-system-log.txt" 2>&1 || true
            return "$exit_code"
          }
          trap capture_diagnostics EXIT

          xcrun simctl list devices available -j > "$EVIDENCE_DIR/devices.json"
          node -e '
            const data = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const device = Object.values(data.devices).flat().find((item) => item.isAvailable && /^iPhone/.test(item.name));
            if (!device) process.exit(2);
            process.stdout.write([device.udid, device.name, device.state].join("\n") + "\n");
          ' "$EVIDENCE_DIR/devices.json" > "$EVIDENCE_DIR/device-selection.txt"

          DEVICE_ID="$(sed -n '1p' "$EVIDENCE_DIR/device-selection.txt")"
          DEVICE_NAME="$(sed -n '2p' "$EVIDENCE_DIR/device-selection.txt")"
          DEVICE_STATE="$(sed -n '3p' "$EVIDENCE_DIR/device-selection.txt")"
          test -n "$DEVICE_ID"
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" app > "$EVIDENCE_DIR/app-container.txt"

          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$DEVICE_ID" "$BUNDLE_ID")"
          printf '%s\n' "$LAUNCH_OUTPUT" | tee "$EVIDENCE_DIR/launch-output.txt"
          APP_PID="$(printf '%s\\n' "$LAUNCH_OUTPUT" | sed -nE 's/.*: ([0-9]+)$/\1/p' | tail -n 1)"
          test -n "$APP_PID"
          sleep 8
          kill -0 "$APP_PID"
          xcrun simctl io "$DEVICE_ID" screenshot "$EVIDENCE_DIR/simulator-screenshot.png"
          {
            echo "device_name=$DEVICE_NAME"
            echo "device_udid=$DEVICE_ID"
            echo "device_state_after_launch=Booted"
            echo "bundle_id=$BUNDLE_ID"
            echo "app_pid=$APP_PID"
            echo "process_alive_after_8_seconds=true"
          } | tee "$EVIDENCE_DIR/simulator-result.txt"
          trap - EXIT

      - name: Upload iOS Simulator app artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app-${{ github.sha }}
          path: |
            ios-simulator-app.zip
            ios-simulator-app.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Simulator smoke and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-evidence-${{ github.sha }}
          path: ios-simulator-smoke-evidence/
          if-no-files-found: warn
          retention-days: 7
