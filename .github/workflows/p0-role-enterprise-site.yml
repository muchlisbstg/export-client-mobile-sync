name: P0 Role Enterprise Site Authorization

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/migrate-tenant-isolation.mjs"
      - "test/p0-role-enterprise-site.test.mjs"
      - "test/transaction-authorization.test.mjs"
      - ".github/workflows/p0-role-enterprise-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-role-enterprise-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-enterprise-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run role, enterprise, site, and transaction authorization tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test test/p0-role-enterprise-site.test.mjs test/transaction-authorization.test.mjs test/security-authorization-remediation.test.mjs
