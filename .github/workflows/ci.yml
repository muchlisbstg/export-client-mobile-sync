name: Mobile CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v7
        with:
          path: .ci/mobile
          persist-credentials: false
      - name: Checkout web backend
        uses: actions/checkout@v7
        with:
          repository: muchlisbstg/export-client-web-sync
          ref: main
          path: .ci/web
          persist-credentials: false
      - name: Checkout desktop backend
        uses: actions/checkout@v7
        with:
          repository: muchlisbstg/export-client-desktop-sync
          ref: main
          path: .ci/desktop
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            .ci/web/package-lock.json
            .ci/mobile/package-lock.json
            .ci/desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: .ci/web
      - name: Install mobile dependencies from committed lockfile
        shell: bash
        working-directory: .ci/mobile
        run: |
          lockfile_sha_before=$(sha256sum package-lock.json | cut -d' ' -f1)
          npm ci
          lockfile_sha_after=$(sha256sum package-lock.json | cut -d' ' -f1)
          test "$lockfile_sha_before" = "$lockfile_sha_after"
          printf 'package_lock_sha256=%s\n' "$lockfile_sha_after" >> "$GITHUB_STEP_SUMMARY"
      - name: Install desktop dependencies
        run: npm ci
        working-directory: .ci/desktop
      - name: Test three-backend synchronization
        run: npm run test:interop
        working-directory: .ci/web
        env:
          MOBILE_REPO: ${{ github.workspace }}/.ci/mobile
          DESKTOP_REPO: ${{ github.workspace }}/.ci/desktop

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from committed lockfile
        shell: bash
        run: |
          lockfile_sha_before=$(sha256sum package-lock.json | cut -d' ' -f1)
          npm ci
          lockfile_sha_after=$(sha256sum package-lock.json | cut -d' ' -f1)
          test "$lockfile_sha_before" = "$lockfile_sha_after"
          printf 'package_lock_sha256=%s\n' "$lockfile_sha_after" >> "$GITHUB_STEP_SUMMARY"
      - name: Test API client
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export
