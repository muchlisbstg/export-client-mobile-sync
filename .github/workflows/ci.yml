name: Mobile CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v7
        with:
          path: .ci/mobile
          persist-credentials: false
      - name: Checkout web backend
        uses: actions/checkout@v7
        with:
          repository: muchlisbstg/export-client-web-sync
          ref: main
          path: .ci/web
          persist-credentials: false
      - name: Checkout desktop backend
        uses: actions/checkout@v7
        with:
          repository: muchlisbstg/export-client-desktop-sync
          ref: main
          path: .ci/desktop
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            .ci/web/package-lock.json
            .ci/mobile/package-lock.json
            .ci/desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: .ci/web
      - name: Install mobile dependencies
        run: npm ci
        working-directory: .ci/mobile
      - name: Install desktop dependencies
        run: npm ci
        working-directory: .ci/desktop
      - name: Test three-backend synchronization
        run: npm run test:interop
        working-directory: .ci/web
        env:
          MOBILE_REPO: ${{ github.workspace }}/.ci/mobile
          DESKTOP_REPO: ${{ github.workspace }}/.ci/desktop

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test API client
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export
