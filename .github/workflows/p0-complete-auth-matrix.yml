name: P0 Complete Authorization Matrix

on:
  push:
    branches: ["release-readiness/**"]
    paths:
      - "server/**"
      - "test/p0-endpoint-auth-matrix.test.mjs"
      - "test/p0-health-cors-contract.test.mjs"
      - "test/p0-role-enterprise-site.test.mjs"
      - "test/security-authorization-remediation.test.mjs"
      - "test/transaction-authorization.test.mjs"
      - "docs/security/endpoint-authorization-matrix.md"
      - ".github/workflows/p0-complete-auth-matrix.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "test/p0-endpoint-auth-matrix.test.mjs"
      - "test/security-authorization-remediation.test.mjs"
      - "test/transaction-authorization.test.mjs"
      - "docs/p0-api-endpoint-authorization-matrix.md"
      - ".github/workflows/p0-complete-auth-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-complete-auth-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpoint-auth-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete endpoint authentication matrix
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test test/p0-endpoint-auth-matrix.test.mjs test/security-authorization-remediation.test.mjs test/transaction-authorization.test.mjs
