name: P0 Browser Security E2E

on:
  pull_request:
    paths:
      - "server/**"
      - "test/p0-browser-cors.e2e.mjs"
      - ".github/workflows/p0-browser-security-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-browser-security-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-cors:
    name: Chromium browser CORS preflight and actual request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser CORS test
        run: node --test test/p0-browser-cors.e2e.mjs
