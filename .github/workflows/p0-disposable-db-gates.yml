name: P0 Disposable PostgreSQL RLS and SQLite Parity Gates

on:
  push:
    branches:
      - review/p0-domain-schema-readonly-2026-11-10
    paths:
      - "tests/p0-db-gates/**"
      - ".github/workflows/p0-disposable-db-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-disposable-db-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-db-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: gates
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/gates
      PG_API_URL: postgres://app_api:app_api_test_only@localhost:5432/gates
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare evidence directory
        run: |
          mkdir -p artifacts
          printf 'candidate_sha=%s\n' "$GITHUB_SHA" > artifacts/run-context.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci

      - name: Install disposable PostgreSQL client dependency without lockfile mutation
        run: npm install --no-save --package-lock=false pg@8.16.3

      - name: Initialize disposable RLS fixture; preserve output and exit code
        id: fixture
        shell: bash
        run: |
          set +e
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/p0-db-gates/postgres-rls.sql > artifacts/fixture.log 2>&1
          fixture_exit=$?
          set -e
          printf 'fixture_exit=%s\n' "$fixture_exit" > artifacts/fixture-status.txt
          echo "exit_code=$fixture_exit" >> "$GITHUB_OUTPUT"

      - name: Run parity and RLS suites; preserve all outcomes
        id: gates
        if: always()
        shell: bash
        run: |
          set +e
          if [ "${{ steps.fixture.outputs.exit_code }}" = "0" ]; then
            node tests/p0-db-gates/parity-test.mjs > artifacts/parity.json 2>&1
            parity_exit=$?
            rls_exit=$?
          else
            printf '{"suite":"parity","status":"NOT_RUN","reason":"fixture initialization failed"}\n' > artifacts/parity.json
            printf '{"suite":"rls","status":"NOT_RUN","reason":"fixture initialization failed"}\n' > artifacts/rls.json
            parity_exit=125
            rls_exit=125
          fi
          set -e
          {
            echo "candidate_sha=$GITHUB_SHA"
            echo "postgres_image=postgres:16.10"
            echo "node_version=$(node --version)"
            echo "package_lock_sha256=$(sha256sum package-lock.json | cut -d' ' -f1)"
            echo "rls_sql_sha256=$(sha256sum tests/p0-db-gates/postgres-rls.sql | cut -d' ' -f1)"
            echo "parity_script_sha256=$(sha256sum tests/p0-db-gates/parity-test.mjs | cut -d' ' -f1)"
            echo "rls_script_sha256=$(sha256sum tests/p0-db-gates/rls-test.mjs | cut -d' ' -f1)"
          } > artifacts/evidence-manifest.txt
          echo "parity_exit=$parity_exit" >> "$GITHUB_OUTPUT"
          echo "rls_exit=$rls_exit" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-disposable-db-gates-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce fail-closed gate result
        if: always()
        run: |
          test "${{ steps.fixture.outputs.exit_code }}" = "0"
          test "${{ steps.gates.outputs.parity_exit }}" = "0"
          test "${{ steps.gates.outputs.rls_exit }}" = "0"
