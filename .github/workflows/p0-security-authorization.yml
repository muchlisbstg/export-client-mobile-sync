name: P0 Security Authorization Remediation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "test/security-authorization-remediation.test.mjs"
      - ".github/workflows/p0-security-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-security-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run P0 authorization negative tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test test/security-authorization-remediation.test.mjs

      - name: Run existing authorization regression tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test test/auth.test.mjs test/authorization.test.mjs test/transaction-authorization.test.mjs
