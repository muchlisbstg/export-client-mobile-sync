name: Android Preview APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.json"
      - "app.config.*"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "App.*"
      - "assets/**"
      - ".github/workflows/android-preview-apk.yml"

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Validate app and build installable Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Regenerate lockfile from approved package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Preserve regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: export-client-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit

      - name: Run application tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo dependency compatibility
        run: npx expo install --check

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-client-android-preview-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
