name: Android Preview APK

on:
  push:
    branches: ["release-readiness/**"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Validate app and build installable Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preserve committed lockfile for review
        uses: actions/upload-artifact@v7
        with:
          name: export-client-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Install locked JavaScript dependencies from committed lockfile
        shell: bash
        run: |
          lockfile_sha_before=$(sha256sum package-lock.json | cut -d' ' -f1)
          npm ci --no-audit
          lockfile_sha_after=$(sha256sum package-lock.json | cut -d' ' -f1)
          test "$lockfile_sha_before" = "$lockfile_sha_after"
          printf 'package_lock_sha256=%s\n' "$lockfile_sha_after" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture npm audit report
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json 2> npm-audit.stderr.txt
          audit_exit_code=$?
          set -e
          printf '%s\n' "$audit_exit_code" > npm-audit-exit-code.txt
          {
            printf 'workflow_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'node_version=%s\n' "$(node --version)"
            printf 'npm_version=%s\n' "$(npm --version)"
            printf 'package_json_sha256=%s\n' "$(sha256sum package.json | cut -d' ' -f1)"
            printf 'package_lock_sha256=%s\n' "$(sha256sum package-lock.json | cut -d' ' -f1)"
            printf 'audit_timestamp_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > npm-audit-metadata.txt
          {
            echo '## npm audit'
            echo "- Workflow candidate SHA: `$(git rev-parse HEAD)`"
            echo "- package.json SHA-256: `$(sha256sum package.json | cut -d' ' -f1)`"
            echo "- package-lock.json SHA-256: `$(sha256sum package-lock.json | cut -d' ' -f1)`"
            echo "- npm audit exit code: `$audit_exit_code`"
          } >> "$GITHUB_STEP_SUMMARY"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("npm-audit.json","utf8")); const v=r.metadata&&r.metadata.vulnerabilities; if(v){const s=["info","low","moderate","high","critical"].map(k=>k+"="+(v[k]||0)).join(", "); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"- Vulnerabilities: "+s+", total="+(v.total||0)+"\n");} else if(r.error){fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"- npm audit returned an error object: "+JSON.stringify(r.error)+"\n");} else {throw new Error("Unrecognized npm audit JSON shape");}'
          echo "npm audit exit code: $audit_exit_code (report preserved; non-zero can indicate findings)"
      - name: Upload npm audit evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-${{ github.sha }}
          path: |
            npm-audit.json
            npm-audit.stderr.txt
            npm-audit-exit-code.txt
            npm-audit-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Run application tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo dependency compatibility
        run: npx expo install --check

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: export-client-android-preview-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
