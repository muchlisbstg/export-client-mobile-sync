openapi: 3.1.0
info:
  title: Export Client Release Authorization API
  version: 1.0.0-draft.2
  summary: Contract for server-authoritative goods release decisions.
  description: |
    Draft API contract for release authorization. This contract does not claim
    that the API is implemented. Signed contract snapshots, payment ledger,
    evidence register, and server-side authorization remain separate sources
    of truth. QC is a quality decision only and never grants release.
    Approval expiry is 24 hours from the final required approval. Material
    changes invalidate affected approvals server-side. Transaction scope
    activation and reactivation require bilateral approval.
  contact:
    name: Export Client API Governance
servers:
  - url: https://api.example.com/api/v1
    description: Production placeholder; not an operational endpoint.
  - url: https://staging-api.example.com/api/v1
    description: Staging placeholder; not an operational endpoint.
tags:
  - name: Release Requests
  - name: Approvals
  - name: Vetoes
  - name: Suspensions
  - name: Authorizations
  - name: Executions
  - name: Audit
security:
  - BearerAuth: []
paths:
  /release-authorizations/requests:
    post:
      tags: [Release Requests]
      operationId: createReleaseAuthorizationRequest
      summary: Create a release authorization request
      description: Creates a request only; it does not authorize or execute release.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReleaseRequest' }
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [Release Requests]
      operationId: listReleaseAuthorizationRequests
      summary: List release authorization requests
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReleaseRequestStatus' }
        - name: contract_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Page of requests visible to the authenticated actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /release-authorizations/requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Release Requests]
      operationId: getReleaseAuthorizationRequest
      summary: Get a release authorization request
      responses:
        '200':
          description: Request detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /release-authorizations/requests/{request_id}/gates:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Release Requests]
      operationId: getReleaseRequestGates
      summary: Read current release gate evaluation
      description: NOT_APPLICABLE is assigned only by the server policy engine, never by a client.
      responses:
        '200':
          description: Gate results and authoritative source versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateEvaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /release-authorizations/requests/{request_id}/evaluate:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Release Requests]
      operationId: evaluateReleaseRequest
      summary: Re-evaluate release gates
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
      responses:
        '200':
          description: Current gate evaluation. This is not a release authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateEvaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /release-authorizations/requests/{request_id}/seller-instruction:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Approvals]
      operationId: recordSellerReleaseInstruction
      summary: Record seller release instruction
      description: Seller instruction is mandatory under the frozen policy matrix; it is not itself authorization.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SellerInstructionInput' }
      responses:
        '201':
          description: Instruction recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerInstruction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/requests/{request_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Approvals]
      operationId: listReleaseApprovals
      summary: List approvals for a release request
      responses:
        '200':
          description: Approval history; invalidated and expired records remain visible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Approvals]
      operationId: recordReleaseApproval
      summary: Record an approval from an authorized approver
      description: |
        Buyer approval is conditional on the signed contract and applicable law.
        The approval type is extensible for additional contractual party approvals.
        The server calculates expires_at as 24 hours after the final required
        approval is recorded; clients cannot set approval timestamps or expiry.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalInput' }
      responses:
        '201':
          description: Approval recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/requests/{request_id}/vetoes:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Vetoes]
      operationId: createReleaseVeto
      summary: Create a release veto
      description: Veto is a distinct protective decision and lifecycle; it is not a suspension.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VetoInput' }
      responses:
        '201':
          description: Veto created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/vetoes/{veto_id}/clearance:
    parameters:
      - $ref: '#/components/parameters/VetoId'
    post:
      tags: [Vetoes]
      operationId: clearReleaseVeto
      summary: Clear a release veto
      description: Only the authorized owner of the underlying veto domain may clear it. Clearance does not authorize release.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VetoClearanceInput' }
      responses:
        '200':
          description: Veto clearance decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/requests/{request_id}/suspensions:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Suspensions]
      operationId: createReleaseSuspension
      summary: Suspend release processing
      description: Suspension temporarily blocks processing; scope reactivation remains a separate bilateral decision.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspensionInput' }
      responses:
        '201':
          description: Suspension created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suspension' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/suspensions/{suspension_id}/clearance:
    parameters:
      - $ref: '#/components/parameters/SuspensionId'
    post:
      tags: [Suspensions]
      operationId: submitSuspensionClearance
      summary: Submit suspension clearance for verification
      description: Clearance must be verified by the authorized owner of the underlying hold; it triggers revalidation, not release.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspensionClearanceInput' }
      responses:
        '200':
          description: Clearance submission or verification state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suspension' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/requests/{request_id}/revalidate:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Release Requests]
      operationId: revalidateReleaseRequest
      summary: Revalidate all release gates and approvals
      description: Revalidation is required after suspension clearance and material changes. It never reactivates transaction scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevalidateRequest' }
      responses:
        '200':
          description: Revalidation result and invalidated approvals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevalidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /release-authorizations/authorizations/{authorization_id}:
    parameters:
      - $ref: '#/components/parameters/AuthorizationId'
    get:
      tags: [Authorizations]
      operationId: getReleaseAuthorization
      summary: Get a release authorization
      responses:
        '200':
          description: Authorization detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseAuthorization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /release-authorizations/authorizations/{authorization_id}/execute:
    parameters:
      - $ref: '#/components/parameters/AuthorizationId'
    post:
      tags: [Executions]
      operationId: executeReleaseAuthorization
      summary: Execute an authorized goods release
      description: |
        Execution is server-side and atomic with the authorization consumption
        record and audit event. A consumed authorization cannot be executed
        again. On timeout, clients must reconcile using the same idempotency key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteReleaseInput' }
      responses:
        '200':
          description: Existing idempotent execution result or completed execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseExecution' }
        '201':
          description: Release execution committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '423': { $ref: '#/components/responses/Locked' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /release-authorizations/executions/by-idempotency-key/{idempotency_key}:
    parameters:
      - name: idempotency_key
        in: path
        required: true
        description: Original key supplied for the mutation being reconciled.
        schema: { type: string, minLength: 8, maxLength: 128 }
    get:
      tags: [Executions]
      operationId: getExecutionByIdempotencyKey
      summary: Reconcile an execution after timeout or uncertain outcome
      description: |
        The server scopes lookup to authenticated tenant, actor permissions,
        operation and key. A 404 means no record is visible; it is not permission
        to retry with a new key. A 202 outcome requires polling this resource.
      responses:
        '200':
          description: A committed or terminal execution outcome was found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionLookup' }
        '202':
          description: Processing or reconciliation is still in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionLookup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /release-authorizations/executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getReleaseExecution
      summary: Get a release execution
      responses:
        '200':
          description: Execution detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /release-authorizations/requests/{request_id}/audit-events:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Audit]
      operationId: listReleaseAuthorizationAuditEvents
      summary: Read request audit events
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Append-only audit event page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token; tenant and actor context are resolved server-side.
  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    VetoId:
      name: veto_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    SuspensionId:
      name: suspension_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    AuthorizationId:
      name: authorization_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per tenant and operation; server stores canonical payload hash and terminal result.
      schema: { type: string, minLength: 8, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    PageSize:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    BadRequest:
      description: Malformed request or invalid parameter.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Actor is authenticated but lacks permission.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not disclosed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State, version or idempotency conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Business rule or release gate failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Locked:
      description: Release is blocked by an active suspension or veto.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Required dependency is unavailable; outcome may require reconciliation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
    DecimalQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\\.[0-9]+)?$'
      description: Decimal string to avoid binary floating-point quantity errors.
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
    ReleaseRequestStatus:
      type: string
      enum: [DRAFT, EVALUATING, AWAITING_INSTRUCTION, AWAITING_APPROVALS, BLOCKED, AUTHORIZED, EXECUTED, CANCELLED, EXPIRED]
    GateStatus:
      type: string
      enum: [PASS, FAIL, PENDING, NOT_APPLICABLE, STALE]
    GateType:
      type: string
      enum: [CONTRACT, TRANSACTION_SCOPE, PAYMENT, EVIDENCE, GUARANTEE, LEGAL, SHARIA, QC, CUSTODY, INVENTORY, PARTY_APPROVAL]
    ApprovalType:
      type: string
      description: Extensible approval category; server policy determines required party approvals.
      examples: [SELLER_RELEASE, BUYER_RELEASE, CONTRACTUAL_PARTY_RELEASE]
    ApprovalDecision:
      type: string
      enum: [APPROVE, REJECT]
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [contract_id, contract_snapshot_id, contract_item_ids, requested_quantity, unit]
      properties:
        contract_id: { $ref: '#/components/schemas/Identifier' }
        contract_snapshot_id: { $ref: '#/components/schemas/Identifier' }
        contract_item_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Identifier' }
        requested_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unit: { type: string, minLength: 1, maxLength: 32 }
        obligation_ids:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Identifier' }
    ReleaseRequest:
      allOf:
        - $ref: '#/components/schemas/CreateReleaseRequest'
        - type: object
          required: [request_id, status, created_at, updated_at, versions]
          properties:
            request_id: { $ref: '#/components/schemas/Identifier' }
            status: { $ref: '#/components/schemas/ReleaseRequestStatus' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
            updated_at: { $ref: '#/components/schemas/Timestamp' }
            versions: { $ref: '#/components/schemas/EvaluatedVersions' }
            authorization_id: { $ref: '#/components/schemas/Identifier' }
    ReleaseRequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReleaseRequest' }
        next_cursor: { type: string }
    EvaluateRequest:
      type: object
      additionalProperties: false
      properties:
        expected_versions: { $ref: '#/components/schemas/EvaluatedVersions' }
    RevalidateRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
    EvaluatedVersions:
      type: object
      additionalProperties: false
      required: [contract_snapshot_id, scope_version, payment_ledger_version, evidence_register_version, policy_version]
      properties:
        contract_snapshot_id: { $ref: '#/components/schemas/Identifier' }
        scope_version: { type: integer, minimum: 1 }
        scope_status: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN, CLOSED] }
        payment_ledger_version: { type: string, minLength: 1 }
        evidence_register_version: { type: string, minLength: 1 }
        guarantee_register_version: { type: string }
        policy_version: { type: string, minLength: 1 }
    GateResult:
      type: object
      additionalProperties: false
      required: [gate, status, evaluated_at]
      properties:
        gate: { $ref: '#/components/schemas/GateType' }
        status: { $ref: '#/components/schemas/GateStatus' }
        evaluated_at: { $ref: '#/components/schemas/Timestamp' }
        source_reference: { $ref: '#/components/schemas/Identifier' }
        reason_code: { type: string }
        explanation: { type: string }
    GateEvaluation:
      type: object
      additionalProperties: false
      required: [request_id, overall_status, gates, evaluated_at, versions]
      properties:
        request_id: { $ref: '#/components/schemas/Identifier' }
        overall_status: { type: string, enum: [PASS, BLOCKED, PENDING, STALE] }
        gates:
          type: array
          items: { $ref: '#/components/schemas/GateResult' }
        evaluated_at: { $ref: '#/components/schemas/Timestamp' }
        versions: { $ref: '#/components/schemas/EvaluatedVersions' }
    SellerInstructionInput:
      type: object
      additionalProperties: false
      required: [instruction, contract_snapshot_id]
      properties:
        instruction: { type: string, enum: [RELEASE, DO_NOT_RELEASE] }
        contract_snapshot_id: { $ref: '#/components/schemas/Identifier' }
        note: { type: string, maxLength: 1000 }
    SellerInstruction:
      allOf:
        - $ref: '#/components/schemas/SellerInstructionInput'
        - type: object
          required: [instruction_id, actor_id, recorded_at]
          properties:
            instruction_id: { $ref: '#/components/schemas/Identifier' }
            actor_id: { $ref: '#/components/schemas/Identifier' }
            recorded_at: { $ref: '#/components/schemas/Timestamp' }
    ApprovalInput:
      type: object
      additionalProperties: false
      required: [approval_type, decision, contract_snapshot_id, evaluated_versions]
      properties:
        approval_type: { $ref: '#/components/schemas/ApprovalType' }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        contract_snapshot_id: { $ref: '#/components/schemas/Identifier' }
        evaluated_versions: { $ref: '#/components/schemas/EvaluatedVersions' }
        note: { type: string, maxLength: 1000 }
    Approval:
      allOf:
        - $ref: '#/components/schemas/ApprovalInput'
        - type: object
          required: [approval_id, request_id, actor_id, status, approved_at]
          properties:
            approval_id: { $ref: '#/components/schemas/Identifier' }
            request_id: { $ref: '#/components/schemas/Identifier' }
            actor_id: { $ref: '#/components/schemas/Identifier' }
            status: { type: string, enum: [RECORDED, INVALIDATED, EXPIRED] }
            approved_at: { $ref: '#/components/schemas/Timestamp' }
            expires_at:
              allOf: [{ $ref: '#/components/schemas/Timestamp' }]
              description: Server-set to 24 hours after final required approval.
            invalidated_at: { $ref: '#/components/schemas/Timestamp' }
            invalidation_reason: { type: string }
    ApprovalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
    VetoInput:
      type: object
      additionalProperties: false
      required: [domain, reason_code, reason]
      properties:
        domain: { type: string, enum: [LEGAL, SHARIA, FINANCE, QC, WAREHOUSE, SECURITY, CONTRACT] }
        reason_code: { type: string, minLength: 1, maxLength: 64 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        affected_item_ids:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Identifier' }
    VetoClearanceInput:
      type: object
      additionalProperties: false
      required: [decision, evidence_ids, reason]
      properties:
        decision: { type: string, enum: [CLEAR, REJECT] }
        evidence_ids:
          type: array
          items: { $ref: '#/components/schemas/Identifier' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    Veto:
      type: object
      required: [veto_id, request_id, domain, status, created_at]
      properties:
        veto_id: { $ref: '#/components/schemas/Identifier' }
        request_id: { $ref: '#/components/schemas/Identifier' }
        domain: { type: string }
        status: { type: string, enum: [ACTIVE, CLEARANCE_PENDING, CLEARED, REJECTED, SUPERSEDED] }
        reason_code: { type: string }
        reason: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        cleared_at: { $ref: '#/components/schemas/Timestamp' }
        cleared_by: { $ref: '#/components/schemas/Identifier' }
    SuspensionInput:
      type: object
      additionalProperties: false
      required: [domain, reason_code, reason]
      properties:
        domain: { type: string, enum: [LEGAL, SHARIA, FINANCE, QC, WAREHOUSE, SECURITY, CONTRACT, OPERATIONAL] }
        reason_code: { type: string, minLength: 1, maxLength: 64 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        affected_item_ids:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Identifier' }
    SuspensionClearanceInput:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { type: string, enum: [SUBMIT_FOR_VERIFICATION, VERIFY_CLEARANCE, REJECT_CLEARANCE] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidence_ids:
          type: array
          items: { $ref: '#/components/schemas/Identifier' }
    Suspension:
      type: object
      required: [suspension_id, request_id, domain, status, created_at]
      properties:
        suspension_id: { $ref: '#/components/schemas/Identifier' }
        request_id: { $ref: '#/components/schemas/Identifier' }
        domain: { type: string }
        status: { type: string, enum: [ACTIVE, CLEARANCE_SUBMITTED, CLEARANCE_VERIFIED, REVALIDATION_REQUIRED, CLOSED] }
        reason_code: { type: string }
        reason: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        verified_at: { $ref: '#/components/schemas/Timestamp' }
        verified_by: { $ref: '#/components/schemas/Identifier' }
    RevalidationResult:
      type: object
      required: [request_id, gate_evaluation, invalidated_approval_ids, revalidated_at]
      properties:
        request_id: { $ref: '#/components/schemas/Identifier' }
        gate_evaluation: { $ref: '#/components/schemas/GateEvaluation' }
        invalidated_approval_ids:
          type: array
          items: { $ref: '#/components/schemas/Identifier' }
        revalidated_at: { $ref: '#/components/schemas/Timestamp' }
        authorization_eligible: { type: boolean }
    ReleaseAuthorization:
      type: object
      required: [authorization_id, request_id, status, issued_at, expires_at, evaluated_versions]
      properties:
        authorization_id: { $ref: '#/components/schemas/Identifier' }
        request_id: { $ref: '#/components/schemas/Identifier' }
        status: { type: string, enum: [ACTIVE, CONSUMED, INVALIDATED, EXPIRED] }
        issued_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        evaluated_versions: { $ref: '#/components/schemas/EvaluatedVersions' }
        consumed_at: { $ref: '#/components/schemas/Timestamp' }
    ExecuteReleaseInput:
      type: object
      additionalProperties: false
      required: [expected_authorization_version]
      properties:
        expected_authorization_version: { type: string, minLength: 1 }
        note: { type: string, maxLength: 1000 }
    ReleaseExecution:
      type: object
      required: [execution_id, authorization_id, request_id, status, committed_at, idempotency_key]
      properties:
        execution_id: { $ref: '#/components/schemas/Identifier' }
        authorization_id: { $ref: '#/components/schemas/Identifier' }
        request_id: { $ref: '#/components/schemas/Identifier' }
        status: { type: string, enum: [COMMITTED, FAILED] }
        committed_at: { $ref: '#/components/schemas/Timestamp' }
        idempotency_key: { type: string }
        audit_event_id: { $ref: '#/components/schemas/Identifier' }
    ExecutionLookup:
      type: object
      required: [status, idempotency_key, reconciliation_required, retry_allowed]
      properties:
        status: { type: string, enum: [NOT_STARTED, PROCESSING, COMMITTED, FAILED, RECONCILIATION_REQUIRED] }
        idempotency_key: { type: string }
        execution_id: { $ref: '#/components/schemas/Identifier' }
        authorization_id: { $ref: '#/components/schemas/Identifier' }
        reconciliation_required: { type: boolean }
        retry_allowed:
          type: boolean
          description: Server-derived; clients must not infer retry safety from transport errors.
        terminal_problem: { $ref: '#/components/schemas/Problem' }
    AuditEvent:
      type: object
      required: [audit_event_id, event_type, actor_id, occurred_at, sequence]
      properties:
        audit_event_id: { $ref: '#/components/schemas/Identifier' }
        event_type: { type: string }
        actor_id: { $ref: '#/components/schemas/Identifier' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        sequence: { type: integer, minimum: 1 }
        correlation_id: { type: string }
        subject_id: { $ref: '#/components/schemas/Identifier' }
        payload_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        next_cursor: { type: string }
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable application error code.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
            - ACTOR_NOT_AUTHORIZED
            - RESOURCE_NOT_FOUND
            - VALIDATION_FAILED
            - IDEMPOTENCY_CONFLICT
            - VERSION_CONFLICT
            - AUTHORIZATION_ALREADY_CONSUMED
            - RELEASE_GATE_FAILED
            - APPROVAL_INVALIDATED
            - APPROVAL_EXPIRED
            - RELEASE_SUSPENDED
            - RELEASE_VETOED
            - EXECUTION_OUTCOME_UNKNOWN
            - DEPENDENCY_UNAVAILABLE
            - SCOPE_NOT_ACTIVE
            - POLICY_REJECTED
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              code: { type: string }
